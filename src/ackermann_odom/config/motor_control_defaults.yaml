# motor_control_defaults.yaml
#
# 区分不同节点的参数，避免同名参数（如 kp, ki）产生的类型冲突。

# 1. 主驱动与转向逻辑转发节点 (Python)
motor_control_node:
  ros__parameters:
    steer_mode: direct
    cmd_vel_axis: x
    ackermann_wheelbase_m: 1.38
    ackermann_min_speed_m_s: 0.12
    ackermann_max_steer_angle_rad: 0.837758
    
    # 驱动电机的 PID (保持默认整数类型)
    kp: 90
    ki: 15
    kd: 0
    max_pwm_percent: 100.0
    min_effective_pwm_percent: 6.0

# 2. 转向执行闭环控制节点 (C++)
steer_closed_loop_node:
  ros__parameters:
    left_limit_deg: 46.0
    right_limit_deg: -46.0
    home_zero_correction_deg: 0.0
    # 转向舵机的 PID (C++ 支持浮点)
    kp: 5.5
    ki: 0.0
    kd: 0.0
    encoder_counts_per_rev: 9200
    min_effective_pwm_percent: 18.0
    event_debounce_us: 5
    position_deadband_deg: 0.5
